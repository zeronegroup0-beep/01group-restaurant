<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark badge background -->
  <rect x="56" y="56" width="400" height="400" rx="90" ry="90" fill="#04080e" />

  <!-- Neon cyan outer border with glow -->
  <rect x="56" y="56" width="400" height="400" rx="90" ry="90" fill="none" stroke="#00b4d8" stroke-width="12" filter="url(#neon-glow)" opacity="0.9" />
  
  <!-- Crisp inner neon stroke -->
  <rect x="56" y="56" width="400" height="400" rx="90" ry="90" fill="none" stroke="#38bdf8" stroke-width="6" />

  <!-- "01" centered text matching exact screenshot proportions -->
  <g transform="translate(256, 256)" fill="#ffffff">
    <!-- Digit 0 -->
    <path d="
      M -86 -95
      L -44 -95
      L -16 -67
      L -16 67
      L -44 95
      L -86 95
      L -114 67
      L -114 -67
      Z
      M -78 -65
      L -52 -65
      L -44 -57
      L -44 57
      L -52 65
      L -78 65
      L -86 57
      L -86 -57
      Z"
      fill-rule="evenodd"
    />

    <!-- Digit 1 -->
    <path d="
      M 16 -35
      L 16 -68
      L 58 -95
      L 96 -95
      L 96 95
      L 58 95
      L 58 -48
      L 34 -30
      Z"
    />
  </g>
</svg>